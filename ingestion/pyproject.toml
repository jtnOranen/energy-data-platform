[project]
name = "energy-ingest"
version = "0.1.0"
description = "Fetches Fingrid, ENTSO-E and FMI data and writes the raw responses to ADLS landing."
requires-python = ">=3.13,<3.14"
dependencies = [
    "azure-functions>=2.3.0",
    "azure-identity>=1.26.0",
    "azure-storage-blob>=12.31.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["energy_ingest"]
