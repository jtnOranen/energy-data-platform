name: energy
version: "1.0.0"
profile: energy

# Every production run's node results into ops.dbt_results, for the pipeline-health dashboard
# (phase 5, decision 2; macros/store_dbt_results.sql).
on-run-end:
  - "{{ store_dbt_results(results) }}"

# Silver holds staging, intermediate, the seed and the snapshot; gold the star schema. Terraform
# creates both schemas; generate_schema_name decides the real name per target.
models:
  energy:
    staging:
      +schema: silver
      +materialized: view
    intermediate:
      +schema: silver
      +materialized: view
    marts:
      +schema: gold
      +materialized: table
    # Tested report tables the energy_report dashboard selects from (phase 5, decision 1).
    reports:
      +schema: gold
      +materialized: table
    # Views over the system tables and ops.dbt_results for the pipeline_health dashboard (phase
    # 5): views, so the dashboard shows the state when it is opened, not at the last dbt run.
    ops:
      +schema: ops
      +materialized: view

seeds:
  energy:
    +schema: silver

vars:
  # SDAC harmonised clearing price limits (phase 3 spec, step 0 item 7). They move automatically
  # after extreme prices, so the range test only warns.
  price_min_eur_mwh: -600
  price_max_eur_mwh: 4000
  # The facts start where the backfill starts; dim_date covers the history and a few years ahead.
  history_start_utc: "2024-01-01 00:00:00"
  dim_date_start: "2024-01-01"
  dim_date_end: "2030-12-31"
  # Incremental facts rebuild this many days back on each run: more than the 48-hour fetch overlap.
  lookback_days: 3
  # The system tables are metastore-wide; the ops models keep this workspace's rows (Terraform
  # data source azurerm_databricks_workspace.dev, workspace_id).
  workspace_id: "7405610438268005"
