# No secrets here: every target reads its token from the environment or logs in interactively.
# The host isn't secret and stays as long as the workspace does. The warehouse's ID changes whenever
# Terraform recreates it (a rebuild, phase 6), so no target names it: CI and the owner look up the
# warehouse `energy-dev` and set DBT_DATABRICKS_HTTP_PATH, and the job passes `--vars` (below). The
# empty defaults let `dbt parse` run without it; anything that connects fails until it is set.
energy:
  target: dev
  outputs:
    # The owner, locally: browser login (OAuth U2M), or an Entra ID token from `az` in
    # DBT_DATABRICKS_TOKEN if set (dbt/README.md). Writes to dev_silver / dev_gold.
    dev:
      type: databricks
      host: "{{ env_var('DBT_DATABRICKS_HOST', 'adb-7405610438268005.5.azuredatabricks.net') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH', '') }}"
      catalog: energy
      schema: dev
      auth_type: oauth
      token: "{{ env_var('DBT_DATABRICKS_TOKEN', '') }}"
      threads: 4

    # GitHub Actions: an Entra ID token for Azure Databricks from the OIDC login (no PAT, no secret).
    ci:
      type: databricks
      host: "{{ env_var('DBT_DATABRICKS_HOST', 'adb-7405610438268005.5.azuredatabricks.net') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH', '') }}"
      catalog: energy
      schema: ci
      token: "{{ env_var('DBT_DATABRICKS_TOKEN', '') }}"
      threads: 4

    # Pull-request builds (slim CI, phase 4): same token as ci, as the read-only principal, which
    # owns pr_<number>_silver / pr_<number>_gold and drops them when the PR closes.
    pr:
      type: databricks
      host: "{{ env_var('DBT_DATABRICKS_HOST', 'adb-7405610438268005.5.azuredatabricks.net') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH', '') }}"
      catalog: energy
      schema: "pr_{{ env_var('DBT_PR_NUMBER', '0') }}"
      token: "{{ env_var('DBT_DATABRICKS_TOKEN', '') }}"
      threads: 4

    # The Databricks job (phase 3, PR E): Databricks injects DBT_ACCESS_TOKEN for the run-as principal.
    # A serverless dbt task can't set environment variables, so the job passes the warehouse ID,
    # which the bundle looks up by name, as `--vars '{warehouse_id: ...}'`.
    prod:
      type: databricks
      host: "{{ env_var('DBT_DATABRICKS_HOST', 'adb-7405610438268005.5.azuredatabricks.net') }}"
      http_path: "/sql/1.0/warehouses/{{ var('warehouse_id', '') }}"
      catalog: energy
      schema: prod
      token: "{{ env_var('DBT_ACCESS_TOKEN', '') }}"
      threads: 4
