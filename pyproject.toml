[project]
name = "energy-data-platform"
version = "0.0.0"
description = "Workspace root: shared dev tooling for the Python parts of the platform."
requires-python = ">=3.13,<3.14"
dependencies = ["energy-ingest", "energy-bronze"]

[dependency-groups]
# dbt and its linter (dbt/). Not a default group: only the dbt CI job and local dbt work need it
# (`uv sync --group dbt`). Pinned to the version the Databricks job installs (phase 3 spec).
dbt = [
    "dbt-databricks==1.12.7",
    "sqlfluff>=4.4.0",
    "sqlfluff-templater-dbt>=4.4.0",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "tzdata>=2026.5",
]
# Tools run locally by the owner (e.g. ingestion/backfill.py). Not part of the function package.
ops = [
    "azure-keyvault-secrets>=4.11.3",
]
# Local Spark for the bronze tests (databricks/tests). Not a default group: it's large and needs
# Java, so only the Databricks CI job installs it (`uv sync --group spark`). 4.1 is the closest
# open-source release to what serverless environment 6 runs.
spark = [
    "pyspark>=4.1,<4.2",
]

[tool.uv]
package = false
default-groups = ["dev", "ops"]

[tool.uv.workspace]
members = ["ingestion", "databricks"]

[tool.uv.sources]
energy-ingest = { workspace = true }
energy-bronze = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["energy_ingest", "energy_bronze", "conftest", "backfill", "function_app"]

[tool.pytest.ini_options]
testpaths = ["ingestion/tests", "databricks/tests"]
pythonpath = ["ingestion"] # backfill.py and function_app.py live at the app root
