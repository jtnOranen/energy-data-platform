[project]
name = "energy-data-platform"
version = "0.0.0"
description = "Workspace root: shared dev tooling for the Python parts of the platform."
requires-python = ">=3.13,<3.14"
dependencies = ["energy-ingest"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "tzdata>=2026.5",
]
# Tools run locally by the owner (e.g. ingestion/backfill.py). Not part of the function package.
ops = [
    "azure-keyvault-secrets>=4.11.3",
]

[tool.uv]
package = false
default-groups = ["dev", "ops"]

[tool.uv.workspace]
members = ["ingestion"]

[tool.uv.sources]
energy-ingest = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["energy_ingest", "conftest", "backfill", "function_app"]

[tool.pytest.ini_options]
testpaths = ["ingestion/tests"]
pythonpath = ["ingestion"] # backfill.py and function_app.py live at the app root
