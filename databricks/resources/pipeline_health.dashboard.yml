# The pipeline-health dashboard (phase 5): job runs, dbt results, data freshness and cost. Every
# dataset selects from a dbt ops_* view; edited like the report (databricks/README.md).
resources:
  dashboards:
    pipeline_health:
      display_name: Pipeline health
      warehouse_id: ${var.warehouse_id}
      file_path: dashboards/pipeline_health.lvdash.json
      # Viewers query with their own credentials (the owner reads ops and, as account admin, the
      # system tables); see energy_report.dashboard.yml for why not embedded.
      embed_credentials: false
      # Per dashboard, as in energy_report.dashboard.yml.
      permissions:
        - level: CAN_MANAGE
          service_principal_name: fa777966-7f5f-4c68-bfa2-29c733f7f8d5 # deploys
        - level: CAN_READ
          user_name: ${var.owner_user_name}
        - level: CAN_READ
          service_principal_name: 8be8f559-c088-4db5-acbf-60b95f9a6078 # read-only PR principal
