resources:
  jobs:
    bronze_load:
      name: bronze_load
      description: >
        Appends new landing files to the energy.bronze tables with Auto Loader. One task per source,
        so one failing API's files don't hold up the others.

      # Once a day at 06:30 UTC, after that hour's ingestion runs (:05/:10/:15) and 45 minutes before
      # dbt_build (07:15), which is the only reader. Auto Loader picks up every file since the last
      # run, so the cadence only sets how far bronze lags, never what it contains. ADR 0017.
      schedule:
        quartz_cron_expression: "0 30 6 * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED
      max_concurrent_runs: 1

      # Phase 5 alerts: a failed run (after its retries) emails the owner, and so does a run still
      # going after 30 minutes (normally about 7).
      email_notifications:
        on_failure: ["${var.alert_email}"]
        on_duration_warning_threshold_exceeded: ["${var.alert_email}"]
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 1800

      # Serverless jobs compute (ADR 0011). Standard mode is cheaper and may start a few minutes
      # later, which the 45-minute gap before dbt_build absorbs.
      performance_target: STANDARD
      environments:
        - environment_key: bronze
          spec:
            environment_version: "6"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: fingrid
          environment_key: bronze
          max_retries: 1
          min_retry_interval_millis: 300000
          python_wheel_task:
            package_name: energy_bronze
            entry_point: load-bronze
            parameters:
              ["--source", "fingrid", "--catalog", "${var.catalog}", "--landing-url", "${var.landing_url}"]

        - task_key: entsoe
          environment_key: bronze
          max_retries: 1
          min_retry_interval_millis: 300000
          python_wheel_task:
            package_name: energy_bronze
            entry_point: load-bronze
            parameters:
              ["--source", "entsoe", "--catalog", "${var.catalog}", "--landing-url", "${var.landing_url}"]

        - task_key: fmi
          environment_key: bronze
          max_retries: 1
          min_retry_interval_millis: 300000
          python_wheel_task:
            package_name: energy_bronze
            entry_point: load-bronze
            parameters:
              ["--source", "fmi", "--catalog", "${var.catalog}", "--landing-url", "${var.landing_url}"]
