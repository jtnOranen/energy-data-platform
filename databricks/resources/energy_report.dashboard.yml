# The report dashboard (phase 5). The definition is the .lvdash.json file; edit it as described in
# databricks/README.md ("Editing the energy report"). Every dataset selects from a dbt rpt_* model.
resources:
  dashboards:
    energy_report:
      display_name: Energy report
      warehouse_id: ${var.warehouse_id}
      file_path: dashboards/energy_report.lvdash.json
      # Viewers query with their own credentials (the owner reads gold). Embedded credentials would
      # need the bundle's run_as to be whoever deploys, which breaks validation on PRs (read-only
      # principal) and locally (owner); phase 5 spec, step 0 item 3.
      embed_credentials: false
