[project]
name = "energy-bronze"
version = "0.1.0"
description = "Auto Loader job that appends the raw landing files to the bronze Delta tables."
# Serverless environment 6 runs Python 3.12; the workspace root pins 3.13 for the local tools.
requires-python = ">=3.12"
# Nothing at runtime: serverless compute provides pyspark. Local tests get it from the root's
# `spark` dependency group.
dependencies = []

[project.scripts]
load-bronze = "energy_bronze.load:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_bronze"]

[tool.ruff]
extend = "../pyproject.toml"
target-version = "py312" # what serverless runs, so ruff doesn't suggest 3.13-only syntax
