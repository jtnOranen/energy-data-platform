name: Destroy dev

# The destroy half of the phase 6 rebuild test (docs/rebuild.md): removes everything the Asset Bundle
# and Terraform own in dev. What bootstrap.sh owns stays: the workspace, the resource groups, the state
# backend and the GitHub identities (phase 6 spec, decision 1). The rebuild is CI's own workflow_dispatch.
#
# Runs in CI because CLAUDE.md rule 4 forbids a local apply or destroy. Manual only, from main, behind
# a typed confirmation, as the deploying principal in the dev environment.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy dev" to delete everything Terraform and the bundle own'
        required: true
        type: string

permissions:
  contents: read

# Never alongside a deploy: the same state and the same bundle.
concurrency:
  group: terraform-apply-dev
  cancel-in-progress: false

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  DATABRICKS_AUTH_TYPE: github-oidc-azure
  TF_VAR_owner: ${{ vars.OWNER }}
  TF_VAR_owner_object_id: ${{ vars.OWNER_OBJECT_ID }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  TF_VAR_pr_client_id: ${{ vars.AZURE_PR_CLIENT_ID }}
  # force_destroy on the catalog and schemas, so the tables dbt and the bundle created go with them.
  TF_VAR_allow_destroy: "true"
  BUNDLE_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  BUNDLE_VAR_owner_user_name: ${{ vars.OWNER }}

jobs:
  destroy:
    name: destroy dev
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check the confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run this from main."
            exit 1
          fi
          if [[ "$CONFIRM" != "destroy dev" ]]; then
            echo "::error::The confirmation must be exactly: destroy dev"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@8de769ec2543ee05e456ee2121350efc7efc4bda # v1.22.1

      # First, while the catalog still exists: the jobs and dashboards use it. The destroy doesn't use
      # the warehouse ID, and a placeholder skips its lookup by name, which fails on a re-run once
      # Terraform has destroyed the warehouse.
      - name: Bundle destroy
        working-directory: databricks
        env:
          BUNDLE_VAR_warehouse_id: none
        run: databricks bundle destroy -t dev --auto-approve

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.8"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra/envs/dev
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=dev.tfstate"

      # force_destroy has to be in the state before the destroy reads it, so apply it first, but only
      # to those of its resources still in the state: a full apply on a re-run after a half-way stop
      # would create again everything already destroyed.
      - name: Allow the catalog to be destroyed
        working-directory: infra/envs/dev
        run: |
          targets=$(terraform state list \
            | grep -E '^module\.unity_catalog\.(databricks_catalog\.this|databricks_schema\.|databricks_external_location\.lake)' \
            | sed 's/^/-target=/' || true)
          if [[ -n "$targets" ]]; then
            # shellcheck disable=SC2086 # one -target per line
            terraform apply -input=false -auto-approve $targets
          fi

      - name: Terraform destroy
        working-directory: infra/envs/dev
        run: terraform destroy -input=false -auto-approve
