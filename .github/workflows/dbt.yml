name: dbt

# Called by ci.yml when dbt/ changes (ADR 0015).
on:
  workflow_call:

permissions:
  contents: read

env:
  DBT_PROFILES_DIR: .
  # Same fork-PR gate as terraform.yml: only this repository's own branches get the OIDC token.
  IS_TRUSTED_SOURCE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

# On every run: parse and lint (the dbt templater compiles the project, which opens a warehouse
# connection, phase 3 spec step 0 item 8). On pull requests: slim CI, building what the PR changed
# in its own schemas (phase 4 spec, deliverable C). On main: the production manifest that slim CI
# compares against.
jobs:
  check:
    name: dbt parse, sqlfluff, PR build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read # download the production manifest from an earlier run
    defaults:
      run:
        working-directory: dbt
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --group dbt

      - name: dbt deps
        run: uv run dbt deps

      - name: dbt parse
        run: uv run dbt parse --target ci

      - name: Azure login (OIDC)
        if: env.IS_TRUSTED_SOURCE == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          # Pull requests run as the read-only principal, main as the deploying one (ADR 0016).
          client-id: ${{ github.event_name == 'pull_request' && vars.AZURE_PR_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # An Entra ID token for the Azure Databricks application (fixed app ID), valid about an hour.
      # No PAT or secret (phase 3 spec, step 0 item 5).
      - name: Databricks token
        if: env.IS_TRUSTED_SOURCE == 'true'
        run: |
          token=$(az account get-access-token --resource 2ff814a6-3304-4ab8-85cb-cd0e6f879c1d --query accessToken -o tsv)
          echo "::add-mask::$token"
          echo "DBT_DATABRICKS_TOKEN=$token" >> "$GITHUB_ENV"

      - name: sqlfluff lint
        if: env.IS_TRUSTED_SOURCE == 'true'
        run: uv run sqlfluff lint models tests analyses

      # The manifest of the newest main run that built one. dbt/ only changes through CI runs that
      # upload it, so that manifest describes what production runs. Missing (none yet, or expired
      # after 90 days without dbt changes): the PR builds everything in its window instead.
      - name: Download production manifest
        id: manifest
        if: github.event_name == 'pull_request' && env.IS_TRUSTED_SOURCE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=dbt-prod-manifest&per_page=100" \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")]
                  | sort_by(.created_at) | last | .workflow_run.id // empty')
          if [[ -n "$run_id" ]]; then
            gh run download "$run_id" --repo "${{ github.repository }}" --name dbt-prod-manifest --dir prod-state
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Production manifest from run $run_id"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No production manifest; building every model in the PR window."
          fi

      # Slim CI as the read-only principal: build only what the PR changed and what depends on it
      # (state:modified+), reading every unchanged model from production (--defer), into
      # pr_<number>_silver / pr_<number>_gold. The incremental facts start 30 days back (phase 4
      # spec, decision 3), so a PR build takes seconds of warehouse time.
      - name: dbt build (PR schemas)
        if: github.event_name == 'pull_request' && env.IS_TRUSTED_SOURCE == 'true'
        env:
          DBT_PR_NUMBER: ${{ github.event.pull_request.number }}
          HAS_STATE: ${{ steps.manifest.outputs.found }}
        run: |
          window_start=$(date -u -d '30 days ago' +%Y-%m-%d)
          vars="{history_start_utc: '${window_start} 00:00:00'}"
          if [[ "$HAS_STATE" == "true" ]]; then
            uv run dbt build --target pr --select state:modified+ --defer --state prod-state --vars "$vars"
          else
            uv run dbt build --target pr --vars "$vars"
          fi

      # What slim CI compares against: production's manifest (target prod, so it names the silver
      # and gold relations --defer reads from). Parsing needs no warehouse connection.
      - name: Production manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: uv run dbt parse --target prod --target-path prod-target

      - name: Upload production manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dbt-prod-manifest
          path: dbt/prod-target/manifest.json
          retention-days: 90

      # The docs site (descriptions, lineage) as a downloadable artifact. --empty-catalog skips the
      # warehouse's column statistics. Publishing the site is phase 6.
      - name: dbt docs generate
        if: env.IS_TRUSTED_SOURCE == 'true'
        run: uv run dbt docs generate --target ci --empty-catalog

      - name: Upload dbt docs
        if: env.IS_TRUSTED_SOURCE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dbt-docs
          path: |
            dbt/target/index.html
            dbt/target/manifest.json
            dbt/target/catalog.json
          retention-days: 30
